[project]
name = "lsf-mcp-server"
version = "0.1.0"
description = "MCP server for IBM Spectrum LSF job management and file operations"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "LSF MCP Server Contributors" }
]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
lsf-mcp-server = "lsf_mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]